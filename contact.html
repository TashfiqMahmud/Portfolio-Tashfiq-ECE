<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tashfiq | Contact Me</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">

    <nav class="navbar navbar-expand-lg sticky-top portfolio-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">TASHFIQ<span class="accent-text">.ECE</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#contactNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="contactNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About</a>
                    <a class="nav-link" href="projects.html">Projects</a>
                    <a class="nav-link active" href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5 animate-up">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="profile-card p-5 shadow-lg">
                    <h2 class="fw-bold mb-2">Get In Touch</h2>
                    <p class="text-muted mb-4">Have a question? Drop a message below.</p>
                    
                    <form id="contactForm" novalidate>
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold small text-uppercase">Full Name</label>
                            <input type="text" id="formName" class="form-control form-control-lg" placeholder="e.g. Tashfiq Mahmud" required>
                            <div class="error-msg" id="nameError"></div>
                        </div>

                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold small text-uppercase">Email Address</label>
                            <input type="email" id="formEmail" class="form-control form-control-lg" placeholder="name@email.com" required>
                            <div class="error-msg" id="emailError"></div>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold small text-uppercase">Your Message</label>
                            <textarea id="formMessage" class="form-control" rows="4" placeholder="Write your message here..." required></textarea>
                            <div class="error-msg" id="msgError"></div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 fw-bold py-3 shadow">
                            <span id="btnText">Send Message</span>
                            <span id="btnLoader" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>
                    
                    <div id="formStatusContainer" class="mt-4"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
